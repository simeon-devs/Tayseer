services:
  fastapi:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./data:/workspace/data
      - ../../../arrears_benchmark:/workspace/arrears_benchmark
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://arrears_user:arrears_pass@postgres:5432/arrears_db
      CHROMADB_URL: http://chromadb:8000
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: arrears_db
      POSTGRES_USER: arrears_user
      POSTGRES_PASSWORD: arrears_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrears_user -d arrears_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  chromadb_data:
  ollama_data:
